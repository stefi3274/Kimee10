<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 10th Birthday Kimee!</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --aura-color: #ff75a0;
            --pink-light: #ffb3c6;
            --purple: #b388ff;
            --yellow: #ffd600;
            --dark: #121224;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #121224 0%, #080815 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .studio-container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            width: 95%;
            max-width: 850px;
            height: 85vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            transition: border-color 0.5s ease;
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.4s ease forwards;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            color: var(--aura-color);
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            text-shadow: 0 0 20px rgba(255,117,160,0.2);
            transition: color 0.5s ease;
        }

        p {
            font-size: 1.1rem;
            color: #a5a5c5;
            max-width: 550px;
            margin: 0 0 20px 0;
            line-height: 1.5;
        }

        .aura-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 440px;
            margin-top: 15px;
        }

        .aura-btn {
            padding: 18px;
            border-radius: 16px;
            border: 2px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.02);
            color: white;
            font-family: 'Quicksand', sans-serif;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .aura-btn:hover {
            transform: translateY(-3px);
            background: rgba(255,255,255,0.08);
        }

        .wish-input {
            width: 80%;
            max-width: 400px;
            padding: 15px 25px;
            border-radius: 50px;
            border: 2px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3);
            color: white;
            font-family: 'Quicksand', sans-serif;
            font-size: 1.2rem;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }

        .wish-input:focus {
            border-color: var(--aura-color);
        }

        .canvas-workspace {
            display: flex;
            background: rgba(0,0,0,0.25);
            border-radius: 20px;
            padding: 20px;
            gap: 20px;
            width: 95%;
            height: 65%;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .canvas-container {
            position: relative;
            background: #0d0d1a;
            border-radius: 16px;
            border: 2px solid rgba(255,255,255,0.08);
            overflow: hidden;
            flex: 1;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            cursor: crosshair;
            touch-action: none;
            max-width: 100%;
            max-height: 100%;
        }

        .svg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.25;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .svg-overlay svg {
            width: 85%;
            height: 85%;
        }

        .side-toolbar {
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: rgba(255,255,255,0.04);
            padding: 15px;
            border-radius: 16px;
            height: 100%;
            justify-content: center;
            min-width: 110px;
            box-sizing: border-box;
        }

        .palette {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .color-node {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s;
        }

        .color-node.selected {
            border-color: white;
            transform: scale(1.2);
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .brush-control {
            display: flex;
            flex-direction: column;
            gap: 6px;
            color: #a5a5c5;
            font-size: 0.85rem;
            text-align: left;
        }

        .brush-control input, .brush-control select {
            width: 100%;
            accent-color: var(--aura-color);
        }

        .navigation-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            box-sizing: border-box;
            background: rgba(0,0,0,0.15);
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
        }

        .nav-btn {
            background: transparent;
            color: #ffffff;
            border: 2px solid rgba(255,255,255,0.15);
            padding: 12px 26px;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn:hover:not(:disabled) {
            background: white;
            color: #121224;
            border-color: white;
        }

        .nav-btn:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }

        .nav-btn.primary-action {
            background: var(--aura-color);
            border-color: var(--aura-color);
            box-shadow: 0 5px 15px rgba(255, 117, 160, 0.2);
        }

        .nav-btn.primary-action:hover {
            background: #ffffff;
            color: #121224;
            border-color: #ffffff;
            box-shadow: 0 5px 20px rgba(255,255,255,0.4);
        }

        .progress-dots {
            display: flex;
            gap: 10px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            transition: all 0.3s ease;
        }

        .dot.active {
            background: var(--aura-color);
            width: 22px;
            border-radius: 6px;
        }

        .celebration-profile {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 6px solid var(--yellow);
            box-shadow: 0 0 30px rgba(255, 214, 0, 0.3);
            overflow: hidden;
            margin-bottom: 20px;
            animation: pulseGlow 3s infinite ease-in-out;
        }

        .celebration-profile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); border-color: var(--yellow); box-shadow: 0 0 30px rgba(255, 214, 0, 0.3); }
            50% { transform: scale(1.04); border-color: var(--aura-color); box-shadow: 0 0 40px var(--aura-color); }
        }

        .revealed-wish {
            background: rgba(255,255,255,0.06);
            padding: 15px 25px;
            border-radius: 16px;
            border-left: 4px solid var(--yellow);
            font-style: italic;
            margin-top: 15px;
            color: #ffe680;
            max-width: 450px;
        }
    </style>
</head>
<body>

        <div class="main-content">

                <span style="font-size: 3.5rem; margin-bottom: 10px;">✨</span>
