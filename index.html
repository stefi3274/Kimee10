<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Happy Birthday Kimee!</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" media="print" onload="this.media='all'">
<style>
:root {
    --aura: #ff75a0;
    --aura-soft: rgba(255,117,160,0.28);
    --dark: #0a0a14;
    --gold: #ffd600;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
    margin: 0;
    position: fixed;
    inset: 0;
    background: var(--dark);
    color: #fff;
    font-family: 'Fredoka', system-ui, -apple-system, 'Segoe UI', sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
}

/* ---------- Festive background ---------- */
.bg-blobs { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
.bg-blobs i {
    position: absolute;
    width: 65vmax; height: 65vmax;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.55;
    animation: drift 16s ease-in-out infinite alternate;
}
.bg-blobs i:nth-child(1) { background: var(--aura-soft); top: -20vmax; left: -15vmax; }
.bg-blobs i:nth-child(2) { background: rgba(0,242,254,0.16); bottom: -25vmax; right: -20vmax; animation-duration: 21s; }
.bg-blobs i:nth-child(3) { background: rgba(255,214,0,0.10); top: 30%; left: 35%; animation-duration: 26s; }
@keyframes drift {
    from { transform: translate(0,0) scale(1); }
    to   { transform: translate(8vmax, 6vmax) scale(1.18); }
}
#balloons { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
.balloon {
    position: absolute;
    bottom: -80px;
    opacity: 0.55;
    animation: floatUp linear infinite;
}
@keyframes floatUp {
    0%   { transform: translate(0, 0) rotate(-8deg); }
    50%  { transform: translate(30px, -60vh) rotate(8deg); }
    100% { transform: translate(-20px, -120vh) rotate(-6deg); }
}
#ambient { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 50; pointer-events: none; }

/* ---------- App frame ---------- */
.app {
    position: fixed; inset: 0;
    z-index: 5;
    display: flex; flex-direction: column;
    max-width: 1100px;
    margin: 0 auto;
    width: 100%;
}
.topbar { display: flex; align-items: center; gap: 12px; padding: 12px 18px 6px; }
.progress { flex: 1; height: 9px; border-radius: 6px; background: rgba(255,255,255,0.1); position: relative; }
.bar {
    height: 100%; width: 0%;
    border-radius: 6px;
    background: linear-gradient(90deg, var(--aura), var(--gold));
    transition: width 0.6s cubic-bezier(.2,.9,.3,1.2);
    position: relative;
}
.bar::after {
    content: '✨'; position: absolute; right: -10px; top: -9px; font-size: 1.1rem;
    animation: twinkle 1.2s ease-in-out infinite;
}
.step-label { font-size: 0.8rem; color: #a0a0c0; min-width: 44px; text-align: right; }
.main { flex: 1; min-height: 0; position: relative; padding: 6px 18px; }
.navbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 18px calc(12px + env(safe-area-inset-bottom));
}
.nav-btn {
    font-family: inherit;
    background: rgba(255,255,255,0.06);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.18);
    padding: 12px 26px;
    border-radius: 24px;
    cursor: pointer;
    font-weight: 600;
    font-size: 1rem;
    transition: transform .15s, opacity .2s;
}
.nav-btn:active:not(:disabled) { transform: scale(0.94); }
.nav-btn:disabled { opacity: 0.2; cursor: not-allowed; }
.nav-btn.primary-action {
    background: linear-gradient(135deg, var(--aura), var(--gold));
    border-color: transparent;
    color: #1a1020;
}
.nav-btn.primary-action:not(:disabled) { animation: glowPulse 1.8s ease-in-out infinite; }
.nav-btn.hidden { visibility: hidden; }
@keyframes glowPulse {
    0%,100% { box-shadow: 0 0 0 0 var(--aura-soft); }
    50%     { box-shadow: 0 0 22px 6px var(--aura-soft); }
}
@keyframes twinkle {
    0%,100% { transform: scale(0.8) rotate(0deg); opacity: .7; }
    50%     { transform: scale(1.25) rotate(20deg); opacity: 1; }
}

/* ---------- Screens ---------- */
.screen {
    display: none;
    position: absolute; inset: 0;
    padding: 6px 18px;
    flex-direction: column; align-items: center; justify-content: flex-start;
    text-align: center;
    overflow-y: auto; overflow-x: hidden;
}
.screen.active { display: flex; }
.screen > :first-child { margin-top: auto; }
.screen > :last-child { margin-bottom: auto; }
h1 {
    font-size: clamp(1.6rem, 6.2vw, 2.5rem);
    margin: 0 0 8px 0;
    color: var(--aura);
    text-shadow: 0 0 24px var(--aura-soft);
    line-height: 1.15;
}
p.sub { font-size: 1.05rem; color: #b8b8d8; margin: 0 0 18px 0; max-width: 520px; }
.hero-emoji { font-size: 3.6rem; margin-bottom: 6px; line-height: 1; }
.floaty { display: inline-block; animation: floaty 3s ease-in-out infinite 0.9s; }
@keyframes floaty {
    0%,100% { transform: translateY(0) rotate(-4deg); }
    50%     { transform: translateY(-10px) rotate(4deg); }
}

/* Entrance animations: one style per question */
.screen.active .reveal {
    animation: var(--in, kPop) 0.8s var(--ease, cubic-bezier(.22,1,.36,1)) both;
    animation-delay: calc(var(--i, 0) * 80ms);
}
.screen[data-anim="pop"]   { --in: kPop;   --ease: cubic-bezier(.3,1.6,.5,1); }
.screen[data-anim="zoom"]  { --in: kZoom;  --ease: cubic-bezier(.3,1.5,.5,1); }
.screen[data-anim="flip"]  { --in: kFlip;  --ease: cubic-bezier(.22,1,.36,1); }
.screen[data-anim="slide"] { --in: kSlide; --ease: cubic-bezier(.2,1.2,.4,1); }
.screen[data-anim="drop"]  { --in: kDrop;  --ease: cubic-bezier(.3,1.4,.5,1); }
.screen[data-anim="spin"]  { --in: kSpin;  --ease: cubic-bezier(.2,1.1,.4,1); }
.screen[data-anim="swing"] { --in: kSwing; --ease: ease-out; }
.screen[data-anim="rise"]  { --in: kRise;  --ease: cubic-bezier(.22,1,.36,1); }
.screen[data-anim="wobble"]{ --in: kWobble;--ease: ease-out; }
@keyframes kPop    { from { opacity:0; transform: scale(0.3); } to { opacity:1; transform: none; } }
@keyframes kZoom   { from { opacity:0; transform: scale(0.1) rotate(-25deg); } to { opacity:1; transform: none; } }
@keyframes kFlip   { from { opacity:0; transform: perspective(700px) rotateX(-95deg); } to { opacity:1; transform: none; } }
@keyframes kSlide  { from { opacity:0; transform: translateX(calc(var(--dir, 1) * 110vw)); } to { opacity:1; transform: none; } }
@keyframes kDrop   { from { opacity:0; transform: translateY(-70vh) scale(0.8); } to { opacity:1; transform: none; } }
@keyframes kSpin   { from { opacity:0; transform: rotate(-540deg) scale(0); } to { opacity:1; transform: none; } }
@keyframes kSwing  { 0% { opacity:0; transform-origin: top center; transform: rotate(-50deg); } 40% { opacity:1; transform-origin: top center; transform: rotate(22deg); } 70% { transform-origin: top center; transform: rotate(-9deg); } 100% { transform-origin: top center; transform: none; } }
@keyframes kRise   { from { opacity:0; transform: translateY(70px) scale(0.9); filter: blur(10px); } to { opacity:1; transform: none; filter: blur(0); } }
@keyframes kWobble { 0% { opacity:0; transform: translateY(-40px) scaleY(0.6); } 40% { opacity:1; transform: translateY(0) scale(1.12,0.9); } 65% { transform: scale(0.94,1.08); } 100% { transform: none; } }

/* Options */
.opts {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    width: 100%; max-width: 560px;
}
.opt, .aura-btn, .age-btn {
    font-family: inherit;
    position: relative; overflow: hidden;
    display: flex; align-items: center; gap: 10px;
    padding: 14px 14px;
    min-height: 60px;
    border-radius: 18px;
    border: 2px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(6px);
    color: #fff;
    font-size: 1.05rem; font-weight: 600;
    text-align: left;
    cursor: pointer;
    transition: transform .15s, border-color .2s, background .2s;
}
.opt .em { font-size: 1.9rem; line-height: 1; }
.opt::after, .aura-btn::after, .age-btn::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,0.22) 50%, transparent 70%);
    transform: translateX(-120%);
}
.opt:hover::after, .aura-btn:hover::after, .age-btn:hover::after { transform: translateX(120%); transition: transform .7s; }
.opt:hover, .aura-btn:hover, .age-btn:hover { transform: scale(1.04) rotate(-1deg); }
.opt:active, .aura-btn:active, .age-btn:active { transform: scale(0.94); }
.opt.selected, .aura-btn.selected, .age-btn.selected {
    border-color: var(--aura);
    background: var(--aura-soft);
    animation: selPulse .6s ease;
}
@keyframes selPulse { 0% { transform: scale(1); } 40% { transform: scale(1.12) rotate(2deg); } 100% { transform: scale(1); } }
.aura-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; width: 100%; max-width: 460px; }
.aura-btn { justify-content: center; text-align: center; padding: 22px 10px; font-size: 1.1rem;
    border-color: var(--c); box-shadow: 0 0 22px -8px var(--c); }
.age-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; width: 100%; max-width: 400px; }
.age-btn { justify-content: center; font-size: 1.5rem; padding: 16px 0; }

.wish-input {
    font-family: inherit;
    width: 92%; max-width: 460px;
    padding: 16px 22px;
    border-radius: 30px;
    border: 2px solid rgba(255,255,255,0.2);
    background: rgba(0,0,0,0.35);
    color: #fff; font-size: 1.2rem; text-align: center; outline: none;
    transition: border-color .2s, box-shadow .2s;
}
.wish-input:focus { border-color: var(--aura); box-shadow: 0 0 26px -4px var(--aura); }
.hint { margin-top: 12px; font-size: 0.85rem; color: #8888aa; }

/* ---------- Drawing screens ---------- */
.screen.draw { padding: 0; justify-content: flex-start; overflow: hidden; }
.screen.draw > * { margin: 0 !important; }
.draw-head { width: 100%; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 2px 4px 8px; text-align: left; }
.draw-title { font-size: 1.25rem; font-weight: 700; color: var(--aura); text-shadow: 0 0 16px var(--aura-soft); }
.draw-hint { font-size: 0.8rem; color: #9090b0; }
.canvas-container {
    position: relative; flex: 1; min-height: 0; width: 100%;
    border-radius: 20px; overflow: hidden;
    border: 2px solid var(--aura);
    box-shadow: 0 0 30px -8px var(--aura);
    background: #07070f;
    background-image: radial-gradient(rgba(255,255,255,0.07) 1px, transparent 1px);
    background-size: 22px 22px;
}
.canvas-container.light { background-color: #fff7f2; background-image: none; }
canvas.paint-zone { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
.lineart { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.draw-overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none; font-size: 1.4rem; font-weight: 700; color: rgba(255,255,255,0.55);
    text-align: center; padding: 20px; transition: opacity .5s;
    animation: floaty 3s ease-in-out infinite;
}
.light .draw-overlay { color: rgba(80,40,60,0.45); }
.draw-overlay.gone { opacity: 0; }
.toolbar { width: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 2px 2px; }
.palette { display: flex; gap: 8px; flex: 1 1 100%; overflow-x: auto; padding: 4px 2px; scrollbar-width: none; }
.palette::-webkit-scrollbar { display: none; }
.color-node {
    flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%;
    cursor: pointer; border: 3px solid transparent; transition: transform .15s;
}
.color-node.selected { border-color: #fff; transform: scale(1.18); box-shadow: 0 0 12px rgba(255,255,255,0.6); }
.tool { display: flex; align-items: center; gap: 6px; color: #b0b0d0; font-size: 0.85rem; }
.tool input[type=range] { width: 90px; accent-color: var(--aura); }
.tool select {
    font-family: inherit; background: #000; color: #fff;
    border: 1px solid #444; border-radius: 10px; padding: 6px 8px; font-size: 0.85rem;
}
.tool-btn {
    font-family: inherit; background: rgba(255,255,255,0.08); color: #fff;
    border: 1px solid rgba(255,255,255,0.18); border-radius: 14px;
    padding: 7px 12px; font-size: 0.85rem; cursor: pointer;
}
.tool-btn:active { transform: scale(0.92); }
.app.drawing .main { padding: 2px 10px; }
.app.drawing .navbar { padding-top: 6px; }
.app.drawing .nav-btn { padding: 9px 22px; }

/* ---------- Final ---------- */
#s_final { padding-top: 40px; }
.photo-wrap { position: relative; width: 190px; height: 190px; margin-bottom: 14px; flex: 0 0 auto; }
.celebration-profile {
    width: 100%; height: 100%; border-radius: 50%;
    border: 5px solid var(--gold);
    overflow: hidden;
    background: rgba(255,255,255,0.05);
    display: flex; align-items: center; justify-content: center;
    font-size: 5rem;
    animation: haloPulse 2.2s ease-in-out infinite;
}
@keyframes haloPulse {
    0%,100% { box-shadow: 0 0 20px 2px rgba(255,214,0,0.45); }
    50%     { box-shadow: 0 0 42px 10px rgba(255,214,0,0.75); }
}
.celebration-profile img {
    width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%;
    transform: scale(1.3); transform-origin: 57% 60%;
}
.crown { position: absolute; top: -34px; left: 50%; margin-left: -22px; font-size: 2.8rem; transform: rotate(-8deg); animation: floaty 2.4s ease-in-out infinite; }
.orbit { position: absolute; inset: -18px; animation: spin 7s linear infinite; pointer-events: none; }
.orbit span { position: absolute; font-size: 1.3rem; }
.orbit span:nth-child(1) { top: 0; left: 50%; }
.orbit span:nth-child(2) { bottom: 8%; left: 6%; }
.orbit span:nth-child(3) { bottom: 8%; right: 6%; }
@keyframes spin { to { transform: rotate(360deg); } }
.shimmer {
    background: linear-gradient(90deg, var(--aura), var(--gold), #00f2fe, var(--aura));
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    animation: shimmer 4s linear infinite;
    text-shadow: none;
}
@keyframes shimmer { to { background-position: 300% 0; } }
.revealed-wish {
    background: rgba(255,255,255,0.07);
    padding: 10px 18px; border-radius: 14px;
    font-style: italic; margin: 6px 0; color: var(--gold);
    max-width: 94%; word-break: break-word;
}
.pills { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 560px; margin: 8px 0; }
.pill {
    padding: 7px 13px; border-radius: 20px; font-size: 0.9rem; font-weight: 600;
    background: var(--aura-soft); border: 1px solid var(--aura);
    animation: kPop .6s cubic-bezier(.3,1.6,.5,1) both;
}
.congrats { color: var(--gold); font-weight: 600; font-size: 1.1rem; margin: 10px 0; max-width: 520px; min-height: 4.2em; }
.thumbs { display: flex; gap: 12px; justify-content: center; margin: 8px 0; }
.thumbs a { display: block; width: 120px; border-radius: 14px; overflow: hidden; border: 2px solid var(--gold); text-decoration: none; color: #fff; background: #000; }
.thumbs img { display: block; width: 100%; height: 150px; object-fit: cover; }
.thumbs span { display: block; font-size: 0.75rem; padding: 4px 0; background: rgba(0,0,0,0.6); }
.ghost-btn { font-family: inherit; margin-top: 10px; background: transparent; color: #b0b0d0; border: 1px dashed rgba(255,255,255,0.3); border-radius: 18px; padding: 8px 16px; cursor: pointer; }

@media (max-width: 420px) {
    .nav-btn { padding: 11px 20px; }
    .photo-wrap { width: 160px; height: 160px; }
}
@media (prefers-reduced-motion: reduce) {
    .screen.active .reveal { animation-duration: .01s; animation-delay: 0s; }
    .bg-blobs i, .balloon, .floaty, .orbit { animation: none; }
}
</style>
</head>
<body>

<div class="bg-blobs"><i></i><i></i><i></i></div>
<div id="balloons"></div>
<canvas id="ambient"></canvas>

<div class="app" id="app">
    <div class="topbar">
        <div class="progress"><div class="bar" id="bar"></div></div>
        <div class="step-label" id="stepLabel"></div>
    </div>

    <main class="main" id="main">

        <!-- AURA -->
        <section id="s_aura" class="screen active" data-anim="pop">
            <div class="hero-emoji reveal" style="--i:0"><span class="floaty">✨</span></div>
            <h1 class="reveal" style="--i:1">Welcome, Kimee</h1>
            <p class="sub reveal" style="--i:2">Pick your signature aura color to open the party:</p>
            <div class="aura-grid">
                <button class="aura-btn reveal" style="--i:3;--c:#ff75a0" data-aura="#ff75a0">Coral Neon 🌸</button>
                <button class="aura-btn reveal" style="--i:4;--c:#00f2fe" data-aura="#00f2fe">Electric Cyan ⚡</button>
                <button class="aura-btn reveal" style="--i:5;--c:#b388ff" data-aura="#b388ff">Deep Amethyst 🔮</button>
                <button class="aura-btn reveal" style="--i:6;--c:#ffa84c" data-aura="#ffa84c">Sunset Glow 🌅</button>
            </div>
        </section>

        <!-- AGE -->
        <section id="s_age" class="screen" data-anim="wobble">
            <div class="hero-emoji reveal" style="--i:0"><span class="floaty">🎂</span></div>
            <h1 class="reveal" style="--i:1">How old are you turning?</h1>
            <p class="sub reveal" style="--i:2">Tap your new age:</p>
            <div class="age-grid" id="ageGrid"></div>
        </section>

        <!-- DESIGN STUDIO -->
        <section id="s_art" class="screen draw" data-anim="pop">
            <div class="draw-head reveal" style="--i:0">
                <span class="draw-title">🎨 The Design Studio</span>
                <span class="draw-hint">Create your masterpiece</span>
            </div>
            <div class="canvas-container reveal" style="--i:1">
                <canvas id="artCanvas" class="paint-zone"></canvas>
                <div class="draw-overlay" id="artHint">Draw here with your finger ✨</div>
            </div>
            <div class="toolbar reveal" style="--i:2">
                <div class="palette" id="artPalette"></div>
                <label class="tool">Brush
                    <select id="artMode">
                        <option value="solid">Pen</option>
                        <option value="neon">Neon 💡</option>
                        <option value="rainbow">Rainbow 🌈</option>
                        <option value="glitter">Glitter ✨</option>
                    </select>
                </label>
                <label class="tool">Size <input type="range" id="artSize" min="2" max="36" value="8"></label>
                <button class="tool-btn" id="artUndo">↩️ Undo</button>
                <button class="tool-btn" id="artClear">🗑️ Clear</button>
            </div>
        </section>

        <!-- GLAM LAB -->
        <section id="s_glam" class="screen draw" data-anim="pop">
            <div class="draw-head reveal" style="--i:0">
                <span class="draw-title">💄 Pop Star Glam Lab</span>
                <span class="draw-hint">Give the star a makeover</span>
            </div>
            <div class="canvas-container light reveal" style="--i:1">
                <canvas id="makeupCanvas" class="paint-zone"></canvas>
                <svg id="lineart" class="lineart" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" preserveAspectRatio="xMidYMid meet" fill="none" stroke="#444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M60 110 C55 40 145 40 140 110 C150 160 140 200 150 245 L50 245 C60 200 50 160 60 110Z"/>
                    <path d="M62 95 C80 62 120 62 138 95"/>
                    <ellipse cx="100" cy="110" rx="38" ry="50"/>
                    <path d="M85 158 L85 195 M115 158 L115 195"/>
                    <path d="M25 258 C35 215 85 195 85 195 M175 258 C165 215 115 195 115 195"/>
                    <ellipse cx="84" cy="104" rx="9" ry="5"/>
                    <ellipse cx="116" cy="104" rx="9" ry="5"/>
                    <circle cx="84" cy="104" r="2.5"/>
                    <circle cx="116" cy="104" r="2.5"/>
                    <path d="M73 94 Q84 88 95 93 M105 93 Q116 88 127 94"/>
                    <path d="M100 112 L96 128 Q100 131 104 128"/>
                    <path d="M86 142 Q93 136 100 140 Q107 136 114 142 Q100 156 86 142Z"/>
                    <path d="M86 142 Q100 146 114 142"/>
                    <path d="M62 126 l2.5 5 5.5 .8 -4 4 1 5.5 -5 -2.7 -5 2.7 1 -5.5 -4 -4 5.5 -.8z"/>
                    <path d="M138 126 l2.5 5 5.5 .8 -4 4 1 5.5 -5 -2.7 -5 2.7 1 -5.5 -4 -4 5.5 -.8z"/>
                </svg>
                <div class="draw-overlay" id="glamHint">Paint the makeup 💄</div>
            </div>
            <div class="toolbar reveal" style="--i:2">
                <div class="palette" id="makeupPalette"></div>
                <label class="tool">Finish
                    <select id="makeupMode">
                        <option value="cosmetic">Cosmetic</option>
                        <option value="glitter">Glitter ✨</option>
                        <option value="neon">Neon 💡</option>
                    </select>
                </label>
                <label class="tool">Size <input type="range" id="makeupSize" min="3" max="40" value="12"></label>
                <button class="tool-btn" id="makeupUndo">↩️ Undo</button>
                <button class="tool-btn" id="makeupClear">🗑️ Clear</button>
            </div>
        </section>

        <!-- FINAL -->
        <section id="s_final" class="screen" data-anim="pop">
            <div class="photo-wrap reveal" style="--i:0">
                <div class="orbit"><span>✨</span><span>⭐</span><span>💖</span></div>

<canvas id="fx"></canvas>

<script>
(function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var COLORS = ['#ff75a0', '#00f2fe', '#b388ff', '#ffa84c', '#ffd600', '#69f0ae', '#ffffff'];

    /* ================= Questions ================= */
    var QUESTIONS = [
        { id: 'wish', type: 'text', emoji: '🤫', anim: 'swing', title: 'Make a secret wish',
          sub: function () { return 'You are turning ' + state.age + '! Type your wish for this new year of your life:'; },
          ph: 'Write your secret wish...' },
        { id: 'job', type: 'choice', emoji: '🌟', anim: 'zoom', title: 'What do you dream of becoming?',
          opts: [['🎤', 'Singer'], ['🎨', 'Artist'], ['🩺', 'Doctor'], ['🔬', 'Scientist'],
                 ['👗', 'Designer'], ['🚀', 'Astronaut'], ['⚽', 'Athlete'], ['🌍', 'Leader']] },
        { id: 'goal', type: 'choice', emoji: '🎯', anim: 'flip', title: 'Your number one goal this year?',
          opts: [['📚', 'Learn something new', 'learn something new'], ['🦁', 'Be braver', 'be braver'],
                 ['💖', 'Be even kinder', 'be even kinder'], ['🏆', 'Finish a big project', 'finish a big project'],
                 ['💪', 'Get stronger', 'get stronger'], ['👯', 'Make new friends', 'make new friends']] },
        { id: 'power', type: 'choice', emoji: '🦸‍♀️', anim: 'slide', title: 'Pick a superpower!',
          opts: [['🕊️', 'Flying'], ['👻', 'Invisibility'], ['🧠', 'Reading minds'],
                 ['🐾', 'Talking to animals'], ['⏱️', 'Stopping time'], ['🌠', 'Making wishes come true']] },
        { id: 'place', type: 'choice', emoji: '🧳', anim: 'drop', title: 'Where would you love to travel?',
          opts: [['🗼', 'Paris'], ['🗽', 'New York'], ['🏝️', 'A tropical island'],
                 ['🪐', 'Outer space'], ['🎡', 'A giant theme park'], ['🏔️', 'The mountains']] },
        { id: 'happy', type: 'choice', emoji: '😍', anim: 'spin', title: 'What makes you the happiest?',
          opts: [['🎶', 'Music'], ['🖌️', 'Drawing'], ['👯', 'My friends'], ['🏡', 'My family'],
                 ['💃', 'Dancing'], ['📖', 'Stories']] },
        { id: 'dream', type: 'text', emoji: '💭', anim: 'rise', title: 'Your biggest dream, in one sentence',
          sub: 'Dream big, Kimee. Nothing is too big!', ph: 'My biggest dream is...' }
    ];
    var ORDER = ['aura', 'age', 'wish', 'job', 'goal', 'power', 'place', 'happy', 'dream', 'art', 'glam', 'final'];

    var state = { age: 0, auraChosen: false, answers: {} };
    var step = 0;
    var advTimer = null;
    var main = $('main');
    var backBtn = $('backBtn');
    var nextBtn = $('nextBtn');
    var app = $('app');

    /* ================= Build question screens ================= */
    var qById = {};
    QUESTIONS.forEach(function (q) {
        qById[q.id] = q;
        var sec = document.createElement('section');
        sec.className = 'screen';
        sec.id = 's_' + q.id;
        sec.setAttribute('data-anim', q.anim);

        var hero = document.createElement('div');
        hero.className = 'hero-emoji reveal';
        hero.style.setProperty('--i', 0);
        hero.innerHTML = '<span class="floaty">' + q.emoji + '</span>';
        sec.appendChild(hero);

        var h = document.createElement('h1');
        h.className = 'reveal';
        h.style.setProperty('--i', 1);
        h.textContent = q.title;
        sec.appendChild(h);

        if (q.sub) {
            var p = document.createElement('p');
            p.className = 'sub reveal';
            p.id = 'sub_' + q.id;
            p.style.setProperty('--i', 2);
            p.textContent = typeof q.sub === 'function' ? q.sub() : q.sub;
            sec.appendChild(p);
        }

        if (q.type === 'choice') {
            var grid = document.createElement('div');
            grid.className = 'opts';
            q.opts.forEach(function (o, k) {
                var b = document.createElement('button');
                b.className = 'opt reveal';
                b.style.setProperty('--i', k + 2);
                b.style.setProperty('--dir', k % 2 === 0 ? -1 : 1);
                b.setAttribute('data-em', o[0]);
                b.setAttribute('data-label', o[1]);
                b.setAttribute('data-phrase', o[2] || o[1]);
                b.innerHTML = '<span class="em">' + o[0] + '</span><span>' + o[1] + '</span>';
                grid.appendChild(b);
            });
            sec.appendChild(grid);
        } else {
            var inp = document.createElement('input');
            inp.type = 'text';
            inp.className = 'wish-input reveal';
            inp.id = 'in_' + q.id;
            inp.placeholder = q.ph;
            inp.maxLength = 140;
            inp.autocomplete = 'off';
            inp.style.setProperty('--i', 3);
            inp.addEventListener('input', function () {
                state.answers[q.id] = inp.value;
                updateNav();
            });
            inp.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' && inp.value.trim()) { inp.blur(); go(step + 1); }
            });
            sec.appendChild(inp);
            var hint = document.createElement('div');
            hint.className = 'hint reveal';
            hint.style.setProperty('--i', 4);
            hint.textContent = 'Press Enter or tap Next';
            sec.appendChild(hint);
        }
        // insert before the drawing screens so DOM order matches ORDER
        main.insertBefore(sec, $('s_art'));
    });

    /* Age buttons */
    (function () {
        var grid = $('ageGrid');
        for (var a = 6; a <= 17; a++) {
            var b = document.createElement('button');
            b.className = 'age-btn reveal';
            b.style.setProperty('--i', (a - 6) % 4 + Math.floor((a - 6) / 4));
            b.setAttribute('data-age', a);
            b.textContent = a;
            grid.appendChild(b);
        }
    })();

    /* ================= Aura ================= */
    function setAura(color) {
        var n = parseInt(color.slice(1), 16);
        var root = document.documentElement.style;
        root.setProperty('--aura', color);
        root.setProperty('--aura-soft', 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',0.28)');
        COLORS[0] = color;
    }

    /* ================= Click handling ================= */
    main.addEventListener('click', function (e) {
        var t = e.target;
        var el;
        if ((el = t.closest('.aura-btn'))) {
            main.querySelectorAll('.aura-btn').forEach(function (x) { x.classList.remove('selected'); });
            el.classList.add('selected');
            setAura(el.getAttribute('data-aura'));
            state.auraChosen = true;
            burstAt(el, 40);
            updateNav();
            scheduleAdvance('aura');
        } else if ((el = t.closest('.age-btn'))) {
            main.querySelectorAll('.age-btn').forEach(function (x) { x.classList.remove('selected'); });
            el.classList.add('selected');
            state.age = parseInt(el.getAttribute('data-age'), 10);
            burstAt(el, 40);
            updateNav();
            scheduleAdvance('age');
        } else if ((el = t.closest('.opt'))) {
            var sec = el.closest('.screen');
            var qid = sec.id.slice(2);
            sec.querySelectorAll('.opt').forEach(function (x) { x.classList.remove('selected'); });
            el.classList.add('selected');
            state.answers[qid] = {
                em: el.getAttribute('data-em'),
                label: el.getAttribute('data-label'),
                phrase: el.getAttribute('data-phrase')
            };
            burstAt(el, 46);
            updateNav();
            scheduleAdvance(qid);
        }
    });

    function scheduleAdvance(id) {
        clearTimeout(advTimer);
        advTimer = setTimeout(function () {
            if (ORDER[step] === id) go(step + 1);
        }, 750);
    }

    /* ================= Navigation ================= */
    function ord(n) {
        var v = n % 100;
        if (v >= 11 && v <= 13) return n + 'th';
        return n + ({ 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th');
    }

    function canProceed() {
        var id = ORDER[step];
        if (id === 'aura') return state.auraChosen;
        if (id === 'age') return state.age > 0;
        if (qById[id]) {
            var a = state.answers[id];
            if (qById[id].type === 'text') return !!a && a.trim().length > 0;
            return !!a;
        }
        return id !== 'final';
    }

    function updateNav() {
        var id = ORDER[step];
        backBtn.disabled = step === 0;
        nextBtn.disabled = !canProceed();
        nextBtn.classList.toggle('hidden', id === 'final');
        nextBtn.textContent = id === 'glam' ? 'Reveal 🎉' : 'Next →';
        $('bar').style.width = (step / (ORDER.length - 1) * 100) + '%';
        $('stepLabel').textContent = id === 'final' ? '🎉' : (step + 1) + ' / ' + ORDER.length;
    }

    var finalOn = false;
    var typeTimer = null;
    var fireTimer = null;

    function go(n) {
        if (n < 0 || n >= ORDER.length) return;
        clearTimeout(advTimer);
        step = n;
        var id = ORDER[n];
        document.querySelectorAll('.screen').forEach(function (s) {
            s.classList.toggle('active', s.id === 's_' + id);
        });
        app.classList.toggle('drawing', id === 'art' || id === 'glam');
        updateNav();

        stopFinal();
        if (qById[id]) {
            var q = qById[id];
            if (typeof q.sub === 'function') $('sub_' + id).textContent = q.sub();
            if (q.type === 'text') setTimeout(function () {
                if (ORDER[step] === id) $('in_' + id).focus();
            }, 900);
        }
        if (id === 'final') startFinal();
        if (id === 'art' || id === 'glam') {
            setTimeout(function () { if (ORDER[step] === id) burstCenter(26); }, 250);
        }
    }

    backBtn.addEventListener('click', function () { go(step - 1); });
    nextBtn.addEventListener('click', function () { if (canProceed()) go(step + 1); });
    $('restartBtn').addEventListener('click', function () { location.reload(); });

    /* ================= Painting ================= */
    function star(c, x, y, r, rot) {
        c.save();
        c.translate(x, y);
        c.rotate(rot || 0);
        c.beginPath();
        for (var i = 0; i < 8; i++) {
            var a = i * Math.PI / 4;
            var rr = (i % 2 === 0) ? r : r * 0.3;
            c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
        }
        c.closePath();
        c.fill();
        c.restore();
    }

    function hexToRgba(hex, a) {
        var n = parseInt(hex.slice(1), 16);
        return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')';
    }

    function Painter(o) {
        var canvas = $(o.canvas);
        var ctx = canvas.getContext('2d');
        var palette = $(o.palette);
        var color = o.colors[0];
        var drawing = false, last = null, snap = null, pts = [];
        var stack = [], hue = 0, touched = false, strokeMode = 'solid';
        var dpr = 1, cssW = 0, cssH = 0;

        o.colors.forEach(function (c, idx) {
            var node = document.createElement('div');
            node.className = 'color-node' + (idx === 0 ? ' selected' : '');
            node.style.background = c;
            node.addEventListener('click', function () {
                color = c;
                palette.querySelectorAll('.color-node').forEach(function (n) { n.classList.remove('selected'); });
                node.classList.add('selected');
            });
            palette.appendChild(node);
        });

        function size() { return parseInt($(o.size).value, 10); }
        function mode() { return $(o.mode).value; }

        function fit() {
            var r = { width: canvas.clientWidth, height: canvas.clientHeight };
            if (!r.width || !r.height) return;
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            var w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
            if (canvas.width === w && canvas.height === h) return;
            var tmp = null;
            if (canvas.width > 0 && touched) {
                tmp = document.createElement('canvas');
                tmp.width = canvas.width; tmp.height = canvas.height;
                tmp.getContext('2d').drawImage(canvas, 0, 0);
            }
            canvas.width = w; canvas.height = h;
            cssW = r.width; cssH = r.height;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            if (tmp) { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(tmp, 0, 0); ctx.restore(); }
            stack.length = 0;
        }
        if (window.ResizeObserver) new ResizeObserver(fit).observe(canvas);
        window.addEventListener('resize', fit);

        function pos(e) {
            var r = canvas.getBoundingClientRect();
            var sx = r.width ? canvas.clientWidth / r.width : 1;
            var sy = r.height ? canvas.clientHeight / r.height : 1;
            return { x: (e.clientX - r.left) * sx, y: (e.clientY - r.top) * sy };
        }

        function sparkle(p, e) {
            var s = size();
            for (var i = 0; i < 5; i++) {
                ctx.fillStyle = [color, '#ffffff', '#ffd600'][Math.floor(Math.random() * 3)];
                star(ctx, p.x + (Math.random() - 0.5) * s * 2.2, p.y + (Math.random() - 0.5) * s * 2.2,
                     Math.random() * (s * 0.35) + 2, Math.random() * 3);
            }
            if (e && Math.random() < 0.5) spawnStar(e.clientX, e.clientY, color);
        }

        function stamp(p, e) {
            var s = size();
            if (strokeMode === 'glitter') { sparkle(p, e); return; }
            ctx.save();
            if (strokeMode === 'cosmetic') ctx.globalAlpha = 0.5;
            if (strokeMode === 'neon') { ctx.shadowColor = color; ctx.shadowBlur = s * 1.5; }
            ctx.fillStyle = strokeMode === 'rainbow' ? 'hsl(' + hue + ',95%,60%)' : color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, s / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function segment(p, e) {
            var s = size();
            if (strokeMode === 'glitter') { sparkle(p, e); last = p; return; }
            if (strokeMode === 'cosmetic') {
                if (snap) ctx.putImageData(snap, 0, 0);
                ctx.save();
                ctx.globalAlpha = 0.5;
                ctx.strokeStyle = color; ctx.lineWidth = s;
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
                ctx.stroke();
                ctx.restore();
                last = p;
                return;
            }
            ctx.save();
            if (strokeMode === 'rainbow') { hue = (hue + 5) % 360; ctx.strokeStyle = 'hsl(' + hue + ',95%,60%)'; }
            else ctx.strokeStyle = color;
            if (strokeMode === 'neon') { ctx.shadowColor = color; ctx.shadowBlur = s * 1.5; }
            ctx.lineWidth = s;
            ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
            if (strokeMode === 'neon') {
                ctx.shadowBlur = 0; ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = Math.max(1, s * 0.3);
                ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
            }
            ctx.restore();
            last = p;
        }

        function pushUndo() {
            try {
                stack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
                if (stack.length > 10) stack.shift();
            } catch (err) {}
        }

        canvas.addEventListener('pointerdown', function (e) {
            e.preventDefault();
            if (!canvas.width) return;
            try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
            pushUndo();
            snap = stack[stack.length - 1] || null;
            strokeMode = mode();
            drawing = true; touched = true;
            last = pos(e); pts = [last];
            if ($(o.hint)) $(o.hint).classList.add('gone');
            stamp(last, e);
        });
        canvas.addEventListener('pointermove', function (e) {
            if (!drawing) return;
            e.preventDefault();
            var p = pos(e);
            pts.push(p);
            segment(p, e);
        });
        function stop() { drawing = false; snap = null; }
        canvas.addEventListener('pointerup', stop);
        canvas.addEventListener('pointercancel', stop);

        $(o.undo).addEventListener('click', function () {
            var s = stack.pop();
            if (s) ctx.putImageData(s, 0, 0);
        });
        $(o.clear).addEventListener('click', function () {
            pushUndo();
            ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.restore();
        });

        this.hasInk = function () { return touched && canvas.width > 0; };
        this.exportImage = function (cb) {
            if (!this.hasInk()) { cb(null); return; }
            var t = document.createElement('canvas');
            t.width = canvas.width; t.height = canvas.height;
            var c = t.getContext('2d');
            c.fillStyle = o.bg; c.fillRect(0, 0, t.width, t.height);
            c.drawImage(canvas, 0, 0);
            if (!o.svg) { cb(t.toDataURL('image/png')); return; }
            var svg = $(o.svg).cloneNode(true);
            svg.setAttribute('width', cssW); svg.setAttribute('height', cssH);
            var str = new XMLSerializer().serializeToString(svg);
            var img = new Image();
            img.onload = function () {
                c.drawImage(img, 0, 0, t.width, t.height);
                try { cb(t.toDataURL('image/png')); } catch (err) { cb(null); }
            };
            img.onerror = function () { cb(t.toDataURL('image/png')); };
            img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(str);
        };
    }

    var art = new Painter({
        canvas: 'artCanvas', palette: 'artPalette', size: 'artSize', mode: 'artMode',
        undo: 'artUndo', clear: 'artClear', hint: 'artHint', bg: '#07070f',
        colors: ['#ff75a0', '#00f2fe', '#b388ff', '#ffa84c', '#ffffff', '#ffd600', '#69f0ae', '#ff5252', '#2979ff', '#e040fb', '#76ff03', '#ff9100']
    });
    var glam = new Painter({
        canvas: 'makeupCanvas', palette: 'makeupPalette', size: 'makeupSize', mode: 'makeupMode',
        undo: 'makeupUndo', clear: 'makeupClear', hint: 'glamHint', bg: '#fff7f2', svg: 'lineart',
        colors: ['#e91e63', '#ff5252', '#9c27b0', '#3f51b5', '#00bcd4', '#4caf50', '#ffc107', '#795548', '#ff80ab', '#7c4dff', '#ff6f00', '#212121']
    });

    /* ================= Effects: ambient + fx ================= */
    var amb = $('ambient'), actx = amb.getContext('2d');
    var fx = $('fx'), fctx = fx.getContext('2d');
    var W = 0, H = 0, fdpr = 1;
    var stars = [];
    var parts = [];

    function sizeCanvases() {
        W = window.innerWidth; H = window.innerHeight;
        fdpr = Math.min(window.devicePixelRatio || 1, 2);
        amb.width = W; amb.height = H;
        fx.width = Math.round(W * fdpr); fx.height = Math.round(H * fdpr);
        fctx.setTransform(fdpr, 0, 0, fdpr, 0, 0);
    }
    sizeCanvases();
    window.addEventListener('resize', sizeCanvases);

    for (var i = 0; i < (reduce ? 0 : 34); i++) {
        stars.push({
            x: Math.random() * 2000, y: Math.random() * 1400,
            r: Math.random() * 5 + 2, v: Math.random() * 0.35 + 0.08,
            ph: Math.random() * 6.28, c: COLORS[Math.floor(Math.random() * COLORS.length)]
        });
    }

    function addPart(p) { if (parts.length < 450) parts.push(p); }

    function spawnStar(x, y, c) {
        if (reduce) return;
        addPart({ t: 's', x: x, y: y, vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2 - 0.5,
                  g: 0.04, r: Math.random() * 6 + 3, rot: Math.random() * 3, vr: 0.1,
                  c: c || COLORS[Math.floor(Math.random() * COLORS.length)], life: 0, max: 40 + Math.random() * 25 });
    }

    function burst(x, y, n) {
        if (reduce) n = Math.round(n / 4);
        for (var i = 0; i < n; i++) {
            var ang = Math.random() * Math.PI * 2;
            var sp = Math.random() * 7 + 2;
            var conf = Math.random() < 0.6;
            addPart({
                t: conf ? 'c' : 's', x: x, y: y,
                vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 3,
                g: conf ? 0.2 : 0.08, drag: 0.985,
                w: Math.random() * 7 + 4, h: Math.random() * 10 + 5, r: Math.random() * 7 + 3,
                rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
                c: COLORS[Math.floor(Math.random() * COLORS.length)],
                life: 0, max: 70 + Math.random() * 50
            });
        }
    }
    function burstAt(el, n) {
        var r = el.getBoundingClientRect();
        burst(r.left + r.width / 2, r.top + r.height / 2, n);
    }
    function burstCenter(n) { burst(W / 2, H * 0.4, n); }

    function rain() {
        addPart({
            t: 'c', x: Math.random() * W, y: -12,
            vx: (Math.random() - 0.5) * 1.2, vy: Math.random() * 2 + 1.5, g: 0.01, drag: 1,
            w: Math.random() * 7 + 4, h: Math.random() * 10 + 5, r: 4,
            rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3,
            c: COLORS[Math.floor(Math.random() * COLORS.length)], life: 0, max: 600
        });
    }

    var frame = 0;
    function tick() {
        frame++;
        // ambient twinkling glitter
        actx.clearRect(0, 0, W, H);
        for (var i = 0; i < stars.length; i++) {
            var s = stars[i];
            s.y -= s.v;
            if (s.y < -10) { s.y = H + 10; s.x = Math.random() * W; }
            if (s.x > W) s.x = Math.random() * W;
            actx.globalAlpha = 0.25 + 0.75 * Math.abs(Math.sin(frame * 0.03 + s.ph));
            actx.fillStyle = s.c;
            star(actx, s.x, s.y, s.r, frame * 0.01 + s.ph);
        }
        actx.globalAlpha = 1;

        // fx particles
        fctx.clearRect(0, 0, W, H);
        if (finalOn && frame % 3 === 0) rain();
        for (var k = parts.length - 1; k >= 0; k--) {
            var p = parts[k];
            p.life++;
            if (p.life > p.max || p.y > H + 40) { parts.splice(k, 1); continue; }
            p.x += p.vx; p.y += p.vy; p.vy += p.g;
            if (p.drag) p.vx *= p.drag;
            p.rot += p.vr;
            var a = 1 - p.life / p.max;
            fctx.globalAlpha = a > 0.3 ? 1 : a / 0.3;
            fctx.fillStyle = p.c;
            if (p.t === 'c') {
                fctx.save();
                fctx.translate(p.x, p.y); fctx.rotate(p.rot);
                fctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                fctx.restore();
            } else {
                star(fctx, p.x, p.y, p.r, p.rot);
            }
        }
        fctx.globalAlpha = 1;
        requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    /* Touch / mouse glitter everywhere except drawing canvases */
    var lastTrail = 0;
    document.addEventListener('pointerdown', function (e) {
        if (e.target.closest && e.target.closest('canvas.paint-zone')) return;
        burst(e.clientX, e.clientY, 10);
    });
    document.addEventListener('pointermove', function (e) {
        if (e.target.closest && e.target.closest('canvas.paint-zone')) return;
        if (e.pointerType !== 'mouse' && e.buttons === 0) return;
        var now = Date.now();
        if (now - lastTrail < 45) return;
        lastTrail = now;
        spawnStar(e.clientX, e.clientY);
    });

    /* Floating balloons */
    (function () {
        if (reduce) return;
        var box = $('balloons');
        var list = ['🎈', '🎉', '🎊', '⭐', '💖', '🎈', '✨', '🎁'];
        for (var i = 0; i < 9; i++) {
            var b = document.createElement('span');
            b.className = 'balloon';
            b.textContent = list[i % list.length];
            b.style.left = (Math.random() * 92) + '%';
            b.style.fontSize = (22 + Math.random() * 30) + 'px';
            b.style.animationDuration = (11 + Math.random() * 10) + 's';
            b.style.animationDelay = (-Math.random() * 18) + 's';
            box.appendChild(b);
        }
    })();

    /* ================= Final screen ================= */
    var img = $('profileImg');
    function showFallback() { img.style.display = 'none'; $('profileFallback').style.display = 'inline'; }
    img.addEventListener('error', showFallback);
    if (img.complete && img.naturalWidth === 0) showFallback();

    function pill(text) {
        var s = document.createElement('span');
        s.className = 'pill';
        s.textContent = text;
        return s;
    }

    function startFinal() {
        var A = state.answers;
        $('finalTitle').textContent = 'Happy ' + ord(state.age) + ' Birthday, Kimee!';
        $('finalSub').textContent = state.age + ' years of awesome, and the best is still ahead!';
        $('revealedWish').textContent = A.wish ? 'Your secret wish: "' + A.wish.trim() + '"' : '';
        $('revealedWish').style.display = A.wish ? '' : 'none';
        $('revealedDream').textContent = A.dream ? 'Your biggest dream: "' + A.dream.trim() + '"' : '';
        $('revealedDream').style.display = A.dream ? '' : 'none';

        var pills = $('pills');
        pills.innerHTML = '';
        var defs = [['job', 'Future '], ['goal', 'Goal: '], ['power', 'Superpower: '], ['place', 'Dream trip: '], ['happy', 'Happiest with: ']];
        defs.forEach(function (d, k) {
            var a = A[d[0]];
            if (!a) return;
            var txt = d[0] === 'job' ? a.label.toLowerCase() : a.label;
            var p = pill(a.em + ' ' + d[1] + txt);
            p.style.animationDelay = (0.6 + k * 0.15) + 's';
            pills.appendChild(p);
        });

        // artworks
        var thumbs = $('thumbs');
        thumbs.innerHTML = '';
        [[art, 'Design Studio', 'kimee-design.png'], [glam, 'Glam Lab', 'kimee-glam.png']].forEach(function (x) {
            x[0].exportImage(function (url) {
                if (!url) return;
                var a = document.createElement('a');
                a.href = url; a.download = x[2];
                a.innerHTML = '<img alt="' + x[1] + '"><span>💾 ' + x[1] + '</span>';
                a.querySelector('img').src = url;
                thumbs.appendChild(a);
            });
        });

        // typed message
        var msg = 'Congratulations, Kimee! 🎉 ';
        if (A.job) msg += 'Future ' + A.job.label.toLowerCase() + ', ';
        if (A.goal) msg += 'this year you will ' + A.goal.phrase + '. ';
        if (A.dream) msg += 'May your big dream come true. ';
        msg += 'We are so proud of you! 💫';
        var chars = Array.from(msg), idx = 0;
        var el = $('congrats');
        el.textContent = '';
        clearInterval(typeTimer);
        typeTimer = setInterval(function () {
            idx++;
            el.textContent = chars.slice(0, idx).join('');
            if (idx >= chars.length) clearInterval(typeTimer);
        }, reduce ? 1 : 32);

        finalOn = true;
        burstCenter(90);
        clearInterval(fireTimer);
        fireTimer = setInterval(function () {
            burst(W * (0.15 + Math.random() * 0.7), H * (0.15 + Math.random() * 0.4), 55);
        }, 1400);
    }

    function stopFinal() {
        finalOn = false;
        clearInterval(typeTimer);
        clearInterval(fireTimer);
    }

    updateNav();
})();
</script>
</body>
</html>
