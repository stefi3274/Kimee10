<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Kimee!</title>
    <style>
        :root {
            --aura: #ff75a0;
            --dark: #0a0a14;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--dark);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .studio-container {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 95%;
            max-width: 800px;
            height: 80vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-sizing: border-box;
        }
        .main-content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
        }
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .screen.active {
            display: flex;
        }
        h1 {
            font-size: 2.2rem;
            margin: 0 0 10px 0;
            color: var(--aura);
        }
        p {
            font-size: 1rem;
            color: #a0a0c0;
            margin: 0 0 15px 0;
            max-width: 500px;
        }
        .aura-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 400px;
        }
        .aura-btn {
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.02);
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .wish-input {
            width: 80%;
            max-width: 350px;
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
        }
        .canvas-workspace {
            display: flex;
            background: rgba(0,0,0,0.2);
            border-radius: 16px;
            padding: 10px;
            gap: 15px;
            width: 100%;
            height: 65%;
            box-sizing: border-box;
        }
        .canvas-container {
            position: relative;
            background: #05050a;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            flex: 1;
            height: 100%;
        }
        canvas.paint-zone {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        .side-toolbar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: rgba(255,255,255,0.02);
            padding: 10px;
            border-radius: 12px;
            justify-content: center;
        }
        .palette {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        .color-node {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .color-node.selected {
            border-color: white;
            transform: scale(1.1);
        }
        .brush-control {
            display: flex;
            flex-direction: column;
            gap: 4px;
            color: #a0a0c0;
            font-size: 0.8rem;
            text-align: left;
        }
        .brush-control input {
            width: 70px;
        }
        .navigation-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(0,0,0,0.1);
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-sizing: border-box;
        }
        .nav-btn {
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 10px 22px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
        }
        .nav-btn:disabled {
            opacity: 0.15;
            cursor: not-allowed;
        }
        .nav-btn.primary-action {
            background: var(--aura);
            border-color: var(--aura);
        }
        .progress-dots {
            display: flex;
            gap: 8px;
        }
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
        }
        .dot.active {
            background: var(--aura);
            width: 15px;
            border-radius: 3px;
        }
        .celebration-profile {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 4px solid #ffd600;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .celebration-profile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .revealed-wish {
            background: rgba(255,255,255,0.05);
            padding: 12px 20px;
            border-radius: 12px;
            font-style: italic;
            margin-top: 10px;
            color: #ffd600;
        }
        #bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <div class="studio-container" id="studio">
        <div class="main-content">
            
            <!-- SCREEN 1 -->
            <div id="screen1" class="screen active">
                <span style="font-size: 3rem; margin-bottom: 5px;">✨</span>
                <h1>Welcome, Kimee</h1>
                <p>Pick your signature aura color to open the studio:</p>
                <div class="aura-grid">
                    <button class="aura-btn" onclick="setAura('#ff75a0')">Coral Neon 🌸</button>
                    <button class="aura-btn" onclick="setAura('#00f2fe')">Electric Cyan ⚡</button>
                    <button class="aura-btn" onclick="setAura('#b388ff')">Deep Amethyst 🔮</button>
                    <button class="aura-btn" onclick="setAura('#ffa84c')">Sunset Glow 🌅</button>
                </div>
            </div>

            <!-- SCREEN 2 -->
            <div id="screen2" class="screen">
                <span style="font-size: 3rem; margin-bottom: 5px;">🤫</span>
                <h1>Make a Secret Wish</h1>
                <p>You are turning 10! Type your wish for this new decade:</p>
                <input type="text" id="birthdayWish" class="wish-input" placeholder="Write your secret wish..." autocomplete="off">
            </div>

            <!-- SCREEN 3 -->
            <div id="screen3" class="screen">
                <h1>The Design Studio</h1>
                <p>Draw a beautiful graphic masterpiece with your finger:</p>
                <div class="canvas-workspace">
                    <div class="canvas-container">
                        <canvas id="artCanvas" class="paint-zone"></canvas>
                    </div>
                    <div class="side-toolbar">
                        <div class="palette" id="artPalette"></div>
                        <div class="brush-control">
                            <label>Size</label>
                            <input type="range" id="artBrushSize" min="2" max="20" value="6">
                        </div>
                    </div>
                </div>
            </div>

            <!-- SCREEN 4 -->
            <div id="screen4" class="screen">
                <h1>Pop Star Glam Lab</h1>
                <p>Paint and makeup the star fashion model lineart below:</p>
                <div class="canvas-workspace">
                    <div class="canvas-container">
                        <canvas id="makeupCanvas" class="paint-zone"></canvas>
                    </div>
                    <div class="side-toolbar">
                        <div class="palette" id="makeupPalette"></div>
                        <div class="brush-control">
                            <label>Finish</label>
                            <select id="makeupMode" style="background:#000; color:#fff; border:1px solid #333; font-size:0.75rem;">
                                <option value="rgba">Cosmetic</option>
                                <option value="glitter">Glitter ✨</option>
                            </select>
                        </div>
                        <div class="brush-control">
                            <label>Size</label>
                            <input type="range" id="makeupBrushSize" min="3" max="25" value="8">
                        </div>
                    </div>
                </div>
            </div>

            <!-- SCREEN 5 -->
            <div id="screen5" class="screen">
                <div class="celebration-profile">
